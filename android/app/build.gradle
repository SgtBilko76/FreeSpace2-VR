plugins {
    id 'com.android.application'
}

// Native code is built outside Gradle (build/android-arm64, see tools/quest/build_apk.sh),
// which stages the engine and its libraries into build/quest/jniLibs.
def questOut = file('../../build/quest')

android {
    namespace 'com.bilko.fs2vr'
    compileSdk 35

    defaultConfig {
        applicationId 'com.bilko.fs2vr'
        minSdk 29
        targetSdk 32
        versionCode 3
        versionName '0.1.2-beta'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        debug {
            // The released APKs are signed with this key; keep it so updates install over
            // older versions. Falls back to the local debug key on other machines.
            def releaseKey = file(System.getProperty('user.home') + '/.android/keys/fs2vr-release.keystore')
            storeFile releaseKey.exists() ? releaseKey : file(System.getProperty('user.home') + '/.android/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            debuggable true
        }
        release {
            signingConfig signingConfigs.debug
            debuggable false
            minifyEnabled false
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = [new File(questOut, 'jniLibs')]
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // Khronos OpenXR loader; same version the engine links against (lib/openxr_android.cmake)
    implementation 'org.khronos.openxr:openxr_loader_for_android:1.1.63'
}
